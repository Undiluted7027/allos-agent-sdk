# Run tests on PR
name: Tests/CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Specify which extras to install per Python version
          - python-version: "3.9"
            extras: "openai,anthropic,ollama,cohere"
            test-marker: "not requires_python_310"
          - python-version: "3.10"
            extras: "all"  # Includes Google
            test-marker: ""
          - python-version: "3.11"
            extras: "all"
            test-marker: ""
          - python-version: "3.12"
            extras: "all"
            test-marker: ""
          - python-version: "3.13"
            extras: "all"
            test-marker: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v6
        with:
          # Install a specific version of uv.
          version: 0.9.7
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies for Python 3.9
        if: matrix.python-version == '3.9'
        run: uv sync --locked --extra openai --extra anthropic --extra ollama --extra cohere --extra dev

      - name: Install dependencies for Python 3.10+
        if: matrix.python-version != '3.9'
        run: uv sync --locked --all-extras

      - name: Run tests with marker
        if: matrix.test-marker != ''
        run: uv run pytest -v --cov=allos --cov-report=xml -m "${{ matrix.test-marker }}"

      - name: Run tests without marker
        if: matrix.test-marker == ''
        run: uv run pytest -v --cov=allos --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true # optional (default = false)
          files: ./coverage.xml
          # flags: unittests # optional
          name: codecov-allos # optional
          token: ${{ secrets.CODECOV_TOKEN }}
